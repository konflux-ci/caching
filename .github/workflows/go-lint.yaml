name: Go Lint

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod

      - name: Install mage
        run: go install "github.com/magefile/mage@$(go list -m -f '{{.Version}}' github.com/magefile/mage)"

      - name: Run golangci-lint
        run: mage lint:go
