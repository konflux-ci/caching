{{- if and .Values.squid.enabled .Values.squidExporter.enabled .Values.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.squid.name }}
  namespace: {{ .Values.prometheus.serviceMonitor.namespace | default (include "caching.squid.namespace" .) }}
  labels:
    {{- include "caching.squid.labels" . | nindent 4 }}
    {{- with .Values.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheus.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "caching.squid.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "caching.squid.namespace" . }}
  endpoints:
    - port: metrics
      path: {{ .Values.prometheus.serviceMonitor.path }}
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.prometheus.serviceMonitor.scrapeTimeout }}
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: squid_.*
          action: keep
    {{- if .Values.perSiteExporter.enabled }}
    - port: per-site-http
      path: {{ .Values.perSiteExporter.metricsPath }}
      scheme: https
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.prometheus.serviceMonitor.scrapeTimeout }}
      honorLabels: true
      {{- if .Values.prometheus.serviceMonitor.perSiteTLS.enabled }}
      tlsConfig:
        {{- $svcFQDN := include "caching.squid.fqdn" . }}
        serverName: {{ .Values.prometheus.serviceMonitor.perSiteTLS.serverName | default $svcFQDN }}
        insecureSkipVerify: {{ .Values.prometheus.serviceMonitor.perSiteTLS.insecureSkipVerify | default false }}
        {{- with .Values.prometheus.serviceMonitor.perSiteTLS.ca }}
        {{- $defaultSecretName := printf "%s-tls" (include "caching.squid.namespace" $) }}
        ca:
          secret:
            name: {{ .secretName | default $defaultSecretName }}
            key: {{ .key | default "ca.crt" }}
        {{- end }}
        {{- with .Values.prometheus.serviceMonitor.perSiteTLS.caFile }}
        caFile: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }} 
