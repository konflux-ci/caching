---
# RPM input for Containerfile (squid + go-builder stages on ubi-minimal).
# test.Containerfile uses ubi10/go-toolset and installs no extra RPMs, so it
# does not need entries here. Shared lock must stay resolved against ubi-minimal
# or MintMaker would drop go-toolset/squid as "already in base".
packages:
  - ca-certificates
  - curl
  - gcc
  - git
  - go-toolset
  - gzip
  - squid
  - tar
contentOrigin:
  repofiles:
    - ./ubi-10.repo
arches:
  - x86_64
context:
  # Multi-stage Containerfile: first FROM is ubi-minimal (same digest as --image).
  # Do not point this at test.Containerfile (go-toolset) — that excludes packages
  # the squid image still needs.
  containerfile: Containerfile
